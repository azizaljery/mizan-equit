name: D1 job-state census (read-only SELECTs)

# Read-only evidence for background-job health: daily archive plans, seed result, locks, accuracy rows by state,
# screener follow-up state, table sizes. Only SELECT statements; values truncated; no secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/d1-job-state.yml"

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node --input-type=module <<'NODE' > out/state.json
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,tok=process.env.CLOUDFLARE_API_TOKEN,DB='e95b74e8-81d6-4beb-8ea2-ad59c863d21d';
          const q=async(sql)=>{if(!/^\s*SELECT/i.test(sql))throw Error('select only');const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${acct}/d1/database/${DB}/query`,{method:'POST',headers:{Authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(30000)});const j=await r.json().catch(()=>({}));return j.success?j.result?.[0]?.results:{http:r.status,errors:(j.errors||[]).map(e=>String(e.message).slice(0,160))};};
          const out={at:new Date().toISOString()};
          const Q={
            seed_last:"SELECT updated_at, substr(data,1,1500) d FROM research_state WHERE id='job:forecast-seed:last'",
            daily_plans:"SELECT id, updated_at, json_extract(data,'$.nextCheckAt') nextCheckAt, (SELECT json_group_array(json_object('s',json_extract(v.value,'$.symbol'),'st',json_extract(v.value,'$.state'),'a',json_extract(v.value,'$.attempts'),'e',json_array_length(json_extract(v.value,'$.errors')),'last',json_extract(v.value,'$.errors[#-1].stage'))) FROM json_each(json_extract(data,'$.items')) v) items FROM research_state WHERE id LIKE 'job:daily-forecast:%' ORDER BY updated_at DESC LIMIT 6",
            locks:"SELECT id, until_ms, datetime(until_ms/1000,'unixepoch') until_utc FROM research_locks ORDER BY until_ms DESC LIMIT 30",
            accuracy_rows_by_state:"SELECT state, COUNT(*) n, MIN(updated_at) oldest, MAX(updated_at) newest FROM accuracy_rows GROUP BY state",
            accuracy_runs_recent:"SELECT * FROM accuracy_runs ORDER BY rowid DESC LIMIT 5",
            followup_keys:"SELECT id, updated_at, substr(data,1,600) d FROM research_state WHERE id LIKE '%followup%' ORDER BY updated_at DESC LIMIT 8",
            job_last_keys:"SELECT id, updated_at, json_extract(data,'$.status') status FROM research_state WHERE id LIKE 'job:%last%' OR id LIKE '%:last' ORDER BY updated_at DESC LIMIT 20",
            sizes:"SELECT (SELECT COUNT(*) FROM analysis_snapshots) snapshots,(SELECT COUNT(*) FROM forecast_records) forecasts,(SELECT COUNT(*) FROM forecast_outcomes) outcomes,(SELECT COUNT(*) FROM research_state) state_rows",
            indexes:"SELECT name, tbl_name FROM sqlite_master WHERE type='index' AND tbl_name IN ('analysis_snapshots','forecast_records','forecast_outcomes','accuracy_rows') ORDER BY tbl_name",
            accuracy_rows_detail:"SELECT id, run_id, state, error, updated_at, substr(outcome,1,300) outcome, json_extract(company,'$.symbol') symbol FROM accuracy_rows ORDER BY updated_at DESC LIMIT 25",
            accuracy_runs_all:"SELECT id, created_at, json_extract(data,'$.market') m, json_extract(data,'$.date') d, json_extract(data,'$.sessions') s FROM accuracy_runs ORDER BY created_at DESC LIMIT 10",
            acceptance_full:"SELECT substr(data,1,3000) d FROM research_state WHERE id='job:screener-followup:last'",
            outcomes_by_market_month:"SELECT f.market, substr(json_extract(o.data,'$.actualDate'),1,7) month, COUNT(*) n FROM forecast_outcomes o JOIN forecast_records f ON f.id=o.id GROUP BY 1,2 ORDER BY 2,1",
            records_by_market_month:"SELECT market, substr(created_at,1,7) month, COUNT(*) n, SUM(CASE WHEN id IN (SELECT id FROM forecast_outcomes) THEN 1 ELSE 0 END) evaluated FROM forecast_records GROUP BY 1,2 ORDER BY 2,1",
            sa_due_unevaluated:"SELECT COUNT(*) n FROM forecast_records f WHERE f.market='sa' AND f.id NOT IN (SELECT id FROM forecast_outcomes) AND date(f.created_at, '+'||(f.horizon*2+3)||' days') < date('now')",
            us_due_unevaluated:"SELECT COUNT(*) n FROM forecast_records f WHERE f.market='us' AND f.id NOT IN (SELECT id FROM forecast_outcomes) AND date(f.created_at, '+'||(f.horizon*2+3)||' days') < date('now')",
            last_sa_outcome:"SELECT MAX(json_extract(o.data,'$.actualDate')) d FROM forecast_outcomes o JOIN forecast_records f ON f.id=o.id WHERE f.market='sa'",
            due_by_market_horizon:"SELECT f.market, f.horizon, COUNT(*) due, SUM(CASE WHEN o.id IS NOT NULL THEN 1 ELSE 0 END) evaluated FROM forecast_records f LEFT JOIN forecast_outcomes o ON o.id=f.id WHERE date(f.created_at, '+'||(f.horizon*2+3)||' days') < date('now') GROUP BY 1,2 ORDER BY 1,2",
            direction_mix:"SELECT market, horizon, json_extract(data,'$.direction') dir, COUNT(*) n FROM forecast_records WHERE created_at>=datetime('now','-10 days') GROUP BY 1,2,3 ORDER BY 1,2,4 DESC",
            outcome_dir_mix:"SELECT f.market, f.horizon, json_extract(f.data,'$.direction') pred, json_extract(o.data,'$.actualDirection') act, COUNT(*) n FROM forecast_outcomes o JOIN forecast_records f ON f.id=o.id WHERE json_extract(o.data,'$.state')='complete' GROUP BY 1,2,3,4 ORDER BY 1,2,5 DESC",
            evaluate_last:"SELECT substr(data,1,2500) d FROM research_state WHERE id='job:evaluate-due:last'",
            sa_h5_due_sample:"SELECT f.symbol, f.created_at, json_extract(f.data,'$.anchorDate') anchor, json_extract(f.data,'$.evaluationPolicy') pol, json_extract(f.data,'$.window.estimatedEndAt') endAt FROM forecast_records f LEFT JOIN forecast_outcomes o ON o.id=f.id WHERE f.market='sa' AND f.horizon=5 AND o.id IS NULL AND date(f.created_at,'+13 days')<date('now') ORDER BY f.created_at LIMIT 12",
            backlog_symbols:"SELECT f.market, COUNT(DISTINCT f.symbol) symbols, COUNT(*) forecasts FROM forecast_records f LEFT JOIN forecast_outcomes o ON o.id=f.id WHERE o.id IS NULL AND f.available=1 AND date(f.created_at,'+'||(f.horizon*2+3)||' days')<date('now') AND f.horizon<=21 GROUP BY 1",
            new_symbols_per_day:"SELECT substr(created_at,1,10) d, market, COUNT(DISTINCT symbol) n FROM forecast_records WHERE created_at>=datetime('now','-6 days') GROUP BY 1,2 ORDER BY 1,2",
            daily_pick_tables:"SELECT type,name FROM sqlite_master WHERE name LIKE 'daily_pick%' OR (type='trigger' AND sql LIKE '%daily_pick%') ORDER BY type,name",
            daily_picks_summary:"SELECT market, horizon, pick_date, COUNT(*) n, SUM(in_top) top, SUM(CASE WHEN outcome_state!='pending' THEN 1 ELSE 0 END) done FROM daily_picks GROUP BY 1,2,3 ORDER BY 3 DESC LIMIT 12",
            daily_picks_last:"SELECT updated_at, substr(data,1,1500) d FROM research_state WHERE id='job:daily-picks:last'",
            daily_picks_top:"SELECT market, horizon, pick_date, rank, symbol, round(ref_price,2) ref, round(mom126_5*100,1) mom_pct, round(mizan_predicted_price,2) mizan_pred FROM daily_picks WHERE rank<=3 AND pick_date=(SELECT MAX(pick_date) FROM daily_picks d2 WHERE d2.market=daily_picks.market) ORDER BY market, horizon, rank",
            council_running:"SELECT COUNT(*) n FROM sqlite_master WHERE name='council_runs'",
          };
          for(const [k,sql] of Object.entries(Q)){try{out[k]=await q(sql);}catch(e){out[k]={error:String(e).slice(0,120)};}}
          console.log(JSON.stringify(out,null,1));
          NODE
          node -e 'const fs=require("fs");fs.writeFileSync("out/body.json",JSON.stringify({message:"ci diagnostics: d1 job state "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out/state.json").toString("base64")}))'
          GH_TOKEN="${{ github.token }}" gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/d1-job-state-${{ github.run_id }}-${{ github.run_attempt }}.json" --input out/body.json >/dev/null \
            || echo "WARN: failed to publish result" >&2
