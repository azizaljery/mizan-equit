name: Verify SHARA on live mizan-aziz (read-only scan)

on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/verify-shara-live.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run small live scans and capture the SHARA summary
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out; : > out/shara-live.log
          base="https://mizan-aziz.aljeryabod.workers.dev"
          for spec in "sa 63" "us 63" "sa 5" "us 5"; do
            set -- $spec
            echo "=== market=$1 horizon=$2 ===" >> out/shara-live.log
            code="$(curl -sS -m 170 -o out/r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"market\":\"$1\",\"horizonSessions\":$2,\"resultCount\":5,\"scanLimit\":5}" "$base/api/screener" 2>>out/shara-live.log || echo 000)"
            echo "http=$code bytes=$(wc -c < out/r.json)" >> out/shara-live.log
            jq -c '{scanned,analyzed,eligible,failed,excluded,returned,exclusionCounts,modelVersion,failures:(.failures|map({symbol,reason})),candidates:(.candidates|map({symbol,direction,confidence,expectedChangePct})),shara:(.shara|{version,mode,provisionalThresholds,evaluated,parityPass,marketPass,marketKill,marketSuspend,byGate,wouldRemoveSymbols,verdicts:(.verdicts|map({symbol,parity,parityRule,market,marketRules}))})}' out/r.json >> out/shara-live.log 2>&1 || head -c 600 out/r.json >> out/shara-live.log
          done
          cat out/shara-live.log

      - name: Publish log to repo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          [ -f out/shara-live.log ] || echo "(no log)" > out/shara-live.log
          b64="$(base64 -w0 out/shara-live.log)"
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/shara-live-${{ github.run_id }}-${{ github.run_attempt }}.log" \
            -f message="ci diagnostics: SHARA live scan run ${{ github.run_id }}" -f content="${b64}" -f branch="${{ github.ref_name }}" \
            || echo "WARN: failed to publish log" >&2
# rerun 14:48Z: confirm the renamed key after deploy completes
