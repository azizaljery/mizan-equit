name: Diagnose Worker error 1102 (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/diagnose-1102.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Worker settings (CPU limit / usage model), plan and analytics — read-only API calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out; : > out/diag.log
          B="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          get() { curl -sS -m 60 -o "out/$1.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$2" 2>>out/diag.err || echo 000; }
          c1="$(get settings "$B/workers/scripts/mizan-aziz/settings")"
          c2="$(get subs "$B/subscriptions")"
          c3="$(get acct "$B/workers/account-settings")"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; from="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          jq -cn --arg q "query { viewer { accounts(filter:{accountTag:\"$CLOUDFLARE_ACCOUNT_ID\"}) { workersInvocationsAdaptive(limit:100, filter:{scriptName:\"mizan-aziz\", datetime_geq:\"$from\", datetime_leq:\"$now\"}) { dimensions { status } sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP99 wallTimeP50 wallTimeP99 } } } } }" '{query:$q}' > out/q.json
          c4="$(curl -sS -m 60 -o out/an.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @out/q.json https://api.cloudflare.com/client/v4/graphql 2>>out/diag.err || echo 000)"
          {
            echo "script settings http=$c1: $(jq -c '{limits:.result.limits, usage_model:.result.usage_model, compat:.result.compatibility_date, flags:.result.compatibility_flags, placement:.result.placement, errors:[.errors[]?.message]}' out/settings.json 2>&1 | head -c 600)"
            echo "subscriptions http=$c2: $(jq -c '[.result[]? | {plan:.rate_plan.public_name, id:.rate_plan.id, product:.product.name, state}]' out/subs.json 2>&1 | head -c 900) errors=$(jq -c '[.errors[]?.message]' out/subs.json 2>/dev/null)"
            echo "workers account-settings http=$c3: $(jq -c '{result, errors:[.errors[]?.message]}' out/acct.json 2>&1 | head -c 500)"
            echo "analytics 24h http=$c4: $(jq -c '{errors:[.errors[]?.message], rows:.data.viewer.accounts[0].workersInvocationsAdaptive}' out/an.json 2>&1 | head -c 2500)"
            echo "curl stderr: $(head -c 300 out/diag.err 2>/dev/null)"
          } 2>&1 | sed -E 's/[A-Za-z0-9_-]{32,}/<redacted>/g' >> out/diag.log
          rm -f out/*.json

      - name: Probes with wrangler tail (N=1 vs N=2) to record outcome and CPU time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          npx --yes wrangler@4 tail mizan-aziz --format json > out/tail.jsonl 2> out/tail.err &
          TAILPID=$!
          sleep 25
          base="https://mizan-aziz.aljeryabod.workers.dev"
          probe() {
            local label="$1" market="$2" syms="$3" code
            code="$(curl -sS -m 170 -o out/r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"market\":\"$market\",\"horizonSessions\":5,\"resultCount\":5,\"scanLimit\":5,\"symbols\":$syms}" "$base/api/screener" 2>>out/diag.log || echo 000)"
            echo "[$label] $market $syms http=$code $(head -c 90 out/r.json | tr -d '\n')" | tee -a out/diag.log
          }
          echo "== probes" >> out/diag.log
          probe "US N=1" us '["AAPL"]'
          probe "US N=2" us '["AAPL","MSFT"]'
          probe "US N=2" us '["NVDA","JPM"]'
          probe "SA N=1" sa '["2222.SR"]'
          probe "SA N=2" sa '["2222.SR","1120.SR"]'
          probe "SA N=5" sa '["2222.SR","1120.SR","2010.SR","7010.SR","1180.SR"]'
          sleep 10; kill $TAILPID 2>/dev/null || true
          echo "== tail events" >> out/diag.log
          jq -c 'select(.outcome!=null) | {outcome, cpuTime, wallTime, status: .event.response.status, exceptions: (.exceptions|map(.message)|.[0:1])}' out/tail.jsonl >> out/diag.log 2>&1 || echo "no tail events" >> out/diag.log

      - name: Publish log to repo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          [ -f out/diag.log ] || echo "(no log)" > out/diag.log
          b64="$(base64 -w0 out/diag.log)"
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/diag1102-${{ github.run_id }}-${{ github.run_attempt }}.log" \
            -f message="ci diagnostics: 1102 probe run ${{ github.run_id }}" -f content="${b64}" -f branch="${{ github.ref_name }}" \
            || echo "WARN: failed to publish log" >&2
