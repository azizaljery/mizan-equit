name: Diagnose Worker error 1102 (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/diagnose-1102.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Worker settings (CPU limit / usage model), plan and analytics — read-only API calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out; : > out/diag.log
          cat > out/api.py <<'PY'
          import json, os, re, datetime, urllib.request, urllib.error
          tok, acc = os.environ["CLOUDFLARE_API_TOKEN"], os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode())
                  except Exception: return e.code, {"error": "non-json"}
              except Exception as e: return 0, {"error": repr(e)[:200]}
          def errs(d): return [e.get("message", "")[:160] for e in (d.get("errors") or [])] if isinstance(d, dict) else []
          base = "https://api.cloudflare.com/client/v4/accounts/" + acc
          # Whitelisted fields only: never print bindings, vars or secrets.
          code, d = call(base + "/workers/scripts/mizan-aziz/settings")
          r = (d.get("result") or {}) if isinstance(d, dict) else {}
          print("script settings: http=%s limits=%s usage_model=%s compat_date=%s compat_flags=%s placement=%s errors=%s" % (code, r.get("limits"), r.get("usage_model"), r.get("compatibility_date"), r.get("compatibility_flags"), r.get("placement"), errs(d)))
          code, d = call(base + "/subscriptions")
          res = d.get("result") if isinstance(d, dict) else None
          print("subscriptions: http=%s %s errors=%s" % (code, [((x.get("rate_plan") or {}).get("public_name"), (x.get("rate_plan") or {}).get("id"), (x.get("product") or {}).get("name"), x.get("state")) for x in (res or [])][:12], errs(d)))
          code, d = call(base + "/workers/account-settings")
          print("workers account-settings: http=%s result=%s errors=%s" % (code, json.dumps((d.get("result") if isinstance(d, dict) else None))[:300], errs(d)))
          now = datetime.datetime.now(datetime.timezone.utc); f = lambda x: x.strftime("%Y-%m-%dT%H:%M:%SZ")
          q = ('query { viewer { accounts(filter:{accountTag:"%s"}) { workersInvocationsAdaptive(limit:100, filter:{scriptName:"mizan-aziz", datetime_geq:"%s", datetime_leq:"%s"}) '
               '{ dimensions { status } sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP99 wallTimeP50 wallTimeP99 } } } } }') % (acc, f(now - datetime.timedelta(hours=24)), f(now))
          code, d = call("https://api.cloudflare.com/client/v4/graphql", {"query": q})
          rows = (((d.get("data") or {}).get("viewer") or {}).get("accounts") or [{}])[0].get("workersInvocationsAdaptive") if isinstance(d, dict) and d.get("data") else None
          print("analytics 24h: http=%s errors=%s rows=%s" % (code, errs(d), json.dumps(rows)[:2500]))
          PY
          python3 out/api.py 2>&1 | sed -E 's/[A-Za-z0-9_-]{32,}/<redacted>/g' >> out/diag.log
          rm -f out/api.py

      - name: Probes with wrangler tail (N=1 vs N=2) to record outcome and CPU time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          npx --yes wrangler@4 tail mizan-aziz --format json > out/tail.jsonl 2> out/tail.err &
          TAILPID=$!
          sleep 25
          base="https://mizan-aziz.aljeryabod.workers.dev"
          probe() {
            local label="$1" market="$2" syms="$3" code
            code="$(curl -sS -m 170 -o out/r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"market\":\"$market\",\"horizonSessions\":5,\"resultCount\":5,\"scanLimit\":5,\"symbols\":$syms}" "$base/api/screener" 2>>out/diag.log || echo 000)"
            echo "[$label] $market $syms http=$code $(head -c 90 out/r.json | tr -d '\n')" | tee -a out/diag.log
          }
          echo "== probes" >> out/diag.log
          probe "US N=1" us '["AAPL"]'
          probe "US N=2" us '["AAPL","MSFT"]'
          probe "US N=2" us '["NVDA","JPM"]'
          probe "SA N=1" sa '["2222.SR"]'
          probe "SA N=2" sa '["2222.SR","1120.SR"]'
          probe "SA N=5" sa '["2222.SR","1120.SR","2010.SR","7010.SR","1180.SR"]'
          sleep 10; kill $TAILPID 2>/dev/null || true
          echo "== tail events" >> out/diag.log
          jq -c 'select(.outcome!=null) | {outcome, cpuTime, wallTime, status: .event.response.status, exceptions: (.exceptions|map(.message)|.[0:1])}' out/tail.jsonl >> out/diag.log 2>&1 || echo "no tail events" >> out/diag.log

      - name: Publish log to repo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          [ -f out/diag.log ] || echo "(no log)" > out/diag.log
          b64="$(base64 -w0 out/diag.log)"
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/diag1102-${{ github.run_id }}-${{ github.run_attempt }}.log" \
            -f message="ci diagnostics: 1102 probe run ${{ github.run_id }}" -f content="${b64}" -f branch="${{ github.ref_name }}" \
            || echo "WARN: failed to publish log" >&2
