name: Diagnose Worker error 1102 (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/diagnose-1102.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Worker settings (CPU limit / usage model), plan and analytics — read-only API calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out; : > out/diag.log
          cat > out/api.py <<'PY'
          import json, os, sys, datetime, urllib.request, urllib.error
          tok, acc = os.environ["CLOUDFLARE_API_TOKEN"], os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def call(label, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: txt = r.read().decode()[:3000]; code = r.status
              except urllib.error.HTTPError as e: txt = e.read().decode()[:1500]; code = e.code
              except Exception as e: txt, code = repr(e), 0
              print("== %s -> http=%s\n%s\n" % (label, code, txt))
          base = "https://api.cloudflare.com/client/v4/accounts/" + acc
          call("script settings", base + "/workers/scripts/mizan-aziz/settings")
          call("script-settings", base + "/workers/scripts/mizan-aziz/script-settings")
          call("account subscriptions", base + "/subscriptions")
          call("workers account settings", base + "/workers/account-settings")
          now = datetime.datetime.now(datetime.timezone.utc); f = lambda d: d.strftime("%Y-%m-%dT%H:%M:%SZ")
          q = ('query { viewer { accounts(filter:{accountTag:"%s"}) { workersInvocationsAdaptive(limit:100, filter:{scriptName:"mizan-aziz", datetime_geq:"%s", datetime_leq:"%s"}) '
               '{ dimensions { status } sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP99 wallTimeP50 wallTimeP99 } } } } }') % (acc, f(now - datetime.timedelta(hours=24)), f(now))
          call("analytics 24h", "https://api.cloudflare.com/client/v4/graphql", {"query": q})
          PY
          python3 out/api.py >> out/diag.log 2>&1
          rm -f out/api.py

      - name: Probes with wrangler tail (N=1 vs N=2) to record outcome and CPU time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          npx --yes wrangler@4 tail mizan-aziz --format json > out/tail.jsonl 2> out/tail.err &
          TAILPID=$!
          sleep 25
          base="https://mizan-aziz.aljeryabod.workers.dev"
          probe() {
            local label="$1" market="$2" syms="$3" code
            code="$(curl -sS -m 170 -o out/r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"market\":\"$market\",\"horizonSessions\":5,\"resultCount\":5,\"scanLimit\":5,\"symbols\":$syms}" "$base/api/screener" 2>>out/diag.log || echo 000)"
            echo "[$label] $market $syms http=$code $(head -c 90 out/r.json | tr -d '\n')" | tee -a out/diag.log
          }
          echo "== probes" >> out/diag.log
          probe "US N=1" us '["AAPL"]'
          probe "US N=2" us '["AAPL","MSFT"]'
          probe "US N=2" us '["NVDA","JPM"]'
          probe "SA N=1" sa '["2222.SR"]'
          probe "SA N=2" sa '["2222.SR","1120.SR"]'
          probe "SA N=5" sa '["2222.SR","1120.SR","2010.SR","7010.SR","1180.SR"]'
          sleep 10; kill $TAILPID 2>/dev/null || true
          echo "== tail events" >> out/diag.log
          jq -c 'select(.outcome!=null) | {outcome, cpuTime, wallTime, status: .event.response.status, exceptions: (.exceptions|map(.message)|.[0:1])}' out/tail.jsonl >> out/diag.log 2>&1 || echo "no tail events" >> out/diag.log

      - name: Publish log to repo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          [ -f out/diag.log ] || echo "(no log)" > out/diag.log
          b64="$(base64 -w0 out/diag.log)"
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/diag1102-${{ github.run_id }}-${{ github.run_attempt }}.log" \
            -f message="ci diagnostics: 1102 probe run ${{ github.run_id }}" -f content="${b64}" -f branch="${{ github.ref_name }}" \
            || echo "WARN: failed to publish log" >&2
