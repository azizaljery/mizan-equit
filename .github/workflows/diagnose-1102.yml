name: Diagnose Worker error 1102 (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/diagnose-1102.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Worker analytics (status / CPU) for the last 24h
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out; : > out/diag.log
          python3 - <<'PY' > out/q.json
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          fmt = lambda d: d.strftime("%Y-%m-%dT%H:%M:%SZ")
          acc = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          q = ('query { viewer { accounts(filter:{accountTag:"%s"}) { workersInvocationsAdaptive(limit:100, filter:{scriptName:"mizan-aziz", datetime_geq:"%s", datetime_leq:"%s"}) '
               '{ dimensions { status } sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP99 wallTimeP50 wallTimeP99 } } } } }') % (acc, fmt(now - datetime.timedelta(hours=24)), fmt(now))
          print(json.dumps({"query": q}))
          PY
          echo "== analytics (last 24h)" >> out/diag.log
          curl -sS -m 60 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @out/q.json \
            https://api.cloudflare.com/client/v4/graphql >> out/diag.log 2>&1 || echo "analytics call failed" >> out/diag.log
          echo >> out/diag.log

      - name: Real SEC companyfacts size and parsed heap (memory hypothesis)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          echo "== SEC companyfacts: raw bytes vs parsed heap (node $(node -v))" >> out/diag.log
          ua="Mizan equity research https://mizan-equity.aljeryabod.chatgpt.site"
          for cik in 0000320193 0000789019 0001045810 0000019617 0000034088; do
            curl -sS -m 60 -A "$ua" -H 'Accept: application/json' -o out/cf-$cik.json "https://data.sec.gov/api/xbrl/companyfacts/CIK$cik.json" 2>>out/diag.log || echo "fetch $cik failed" >> out/diag.log
            sleep 1
          done
          node --expose-gc -e '
            const fs=require("fs");let keep=[];
            for(const f of fs.readdirSync("out").filter(x=>x.startsWith("cf-"))){
              const raw=fs.readFileSync("out/"+f,"utf8");if(raw.length<1000){console.log(f,"unusable",raw.slice(0,80));continue}
              global.gc();const before=process.memoryUsage().heapUsed;const obj=JSON.parse(raw);keep.push(obj);global.gc();
              const after=process.memoryUsage().heapUsed;
              console.log(f,"raw_MB="+(raw.length/1e6).toFixed(2),"parsed_heap_MB="+((after-before)/1e6).toFixed(1),"ratio="+(((after-before))/raw.length).toFixed(1)+"x");
            }
            global.gc();console.log("TOTAL heapUsed_MB after keeping all parsed:",(process.memoryUsage().heapUsed/1e6).toFixed(1),"(Worker isolate limit: 128 MB)");
          ' >> out/diag.log 2>&1
          rm -f out/cf-*.json out/q.json

      - name: Controlled live probes (US, horizon 5) by batch size
        shell: bash
        run: |
          set -uo pipefail
          base="https://mizan-aziz.aljeryabod.workers.dev"
          probe() { # label, json symbols array
            local label="$1" syms="$2" t0 t1 code
            t0=$(date +%s.%N)
            code="$(curl -sS -m 170 -o out/r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"market\":\"us\",\"horizonSessions\":5,\"resultCount\":5,\"scanLimit\":5,\"symbols\":$syms}" "$base/api/screener" 2>>out/diag.log || echo 000)"
            t1=$(date +%s.%N)
            echo "[$label] symbols=$syms http=$code wall=$(printf '%.1f' "$(echo "$t1 - $t0" | bc)")s bytes=$(wc -c < out/r.json) $(jq -c '{scanned,analyzed,failed,durationMs}' out/r.json 2>/dev/null || head -c 120 out/r.json)" | tee -a out/diag.log
          }
          echo "== probes" >> out/diag.log
          for s in AAPL MSFT NVDA JPM XOM; do probe "N=1" "[\"$s\"]"; done
          probe "N=2" '["AAPL","MSFT"]'
          probe "N=2" '["NVDA","JPM"]'
          probe "N=5" '["AAPL","MSFT","NVDA","JPM","XOM"]'
          probe "N=5-repeat" '["AAPL","MSFT","NVDA","JPM","XOM"]'
          probe "N=3" '["AAPL","MSFT","NVDA"]'
          probe "N=4" '["AAPL","MSFT","NVDA","JPM"]'

      - name: Publish log to repo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          [ -f out/diag.log ] || echo "(no log)" > out/diag.log
          b64="$(base64 -w0 out/diag.log)"
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/diag1102-${{ github.run_id }}-${{ github.run_attempt }}.log" \
            -f message="ci diagnostics: 1102 probe run ${{ github.run_id }}" -f content="${b64}" -f branch="${{ github.ref_name }}" \
            || echo "WARN: failed to publish log" >&2
