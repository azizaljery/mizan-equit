name: Verify Mizan Equity End to End
on:
  push:
    branches: [codex/mizan-source-security-review-20260919]
    paths:
      - '.github/workflows/verify-mizan-equity.yml'
      - '.github/scripts/mizan-live-acceptance.cjs'
      - '.github/scripts/mizan-operational-audit.mjs'
      - 'mizan-v45/app/**'
      - 'mizan-v45/lib/screener*'
      - 'mizan-v45/lib/company-deep-link*'
      - 'mizan-v45/scripts/build-verified.sh'
      - 'mizan-v45/scripts/verify-release-bundle.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mizan-equity-live-acceptance
  cancel-in-progress: true
jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set isolated browser directory on the runner
        run: echo "PW_ROOT=$RUNNER_TEMP/mizan-browser" >> "$GITHUB_ENV"
      - name: Preserve exact tracked source for independent inspection
        run: |
          mkdir -p mizan-v45/verify-out
          git archive --format=tar HEAD mizan-v45/app mizan-v45/components mizan-v45/lib mizan-v45/worker mizan-v45/tests mizan-v45/scripts mizan-v45/drizzle mizan-v45/package.json mizan-v45/package-lock.json mizan-v45/AGENTS.md mizan-v45/PROJECT_INSTRUCTIONS.md mizan-v45/vite.config.ts mizan-v45/tsconfig.json .github/workflows/deploy-mizan-equity.yml > mizan-v45/verify-out/review-source.tar
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$PW_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.63.0 tsx@4.19.2
          node "$PW_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify deep-link parser and release guard
        run: node --import "$PW_ROOT/node_modules/tsx/dist/loader.mjs" --test mizan-v45/tests/company-deep-link.test.ts mizan-v45/tests/release-bundle.test.mjs
      - name: Wait for deployment checks to stop using market providers
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.github.com/repos/azizaljery/Com/actions/runs?head_sha='+process.env.GITHUB_SHA+'&per_page=20';
          let ready=false;
          for(let i=0;i<48;i++){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_READ_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('Cannot inspect deployment state.');
            const data=await r.json(),run=data.workflow_runs?.find(x=>x.name==='Deploy Mizan Equity'&&x.head_sha===process.env.GITHUB_SHA);
            if(!run||run.status==='completed'){console.log('Deployment workflow: '+(run?.conclusion||'not triggered; source comparison remains required'));ready=true;break;}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw Error('Deployment did not finish within bounded wait.');
          NODE
      - name: Inspect scheduled production failures without modifying samples
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/mizan-operational-audit.mjs
      - name: Full browser scan and archive acceptance
        run: node .github/scripts/mizan-live-acceptance.cjs
      - name: Inspect actual cron heartbeats without starting scheduled jobs
        if: ${{ always() }}
        working-directory: mizan-v45
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-deployment.mjs --audit
      - name: Preserve evidence without cookies or archive access tokens
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mizan-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: mizan-v45/verify-out/
          retention-days: 7
          if-no-files-found: error
