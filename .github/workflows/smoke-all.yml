name: Smoke test all pages and GET endpoints (mizan-aziz, read-only)

# Anonymous visitor view. Pages: real Chromium load, console errors, failed network requests, HTTP status.
# GET APIs: status/time/content-type only. Admin GET endpoints are expected to DENY (401/403) — anything else is a finding.
# No POST calls (no D1 writes).
on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/smoke-all.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Playwright
        run: |
          mkdir -p $RUNNER_TEMP/pw && cd $RUNNER_TEMP/pw && npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1; echo "PW_ROOT=$RUNNER_TEMP/pw" >> $GITHUB_ENV
      - name: Smoke
        env:
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node --input-type=module <<'NODE' > out/smoke.json
          import {createRequire} from 'module';import path from 'path';
          const {chromium}=createRequire(path.join(process.env.PW_ROOT,'package.json'))('playwright');
          const base='https://mizan-aziz.aljeryabod.workers.dev';
          const out={at:new Date().toISOString(),pages:[],apis:[]};
          const pages=['/','/accuracy','/accuracy-sample','/admin/verify','/aziz','/gold','/manual','/screener','/screener/operations','/tests','/does-not-exist-404'];
          const browser=await chromium.launch({headless:true});
          for(const p of pages){
            const ctx=await browser.newContext({locale:'ar-SA'});const page=await ctx.newPage();
            const rec={path:p,console:[],pageErrors:[],failed:[],bad:[]};
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')rec.console.push((m.type()+': '+m.text()).slice(0,220));});
            page.on('pageerror',e=>rec.pageErrors.push(String(e.message||e).slice(0,220)));
            page.on('requestfailed',r=>rec.failed.push((r.url().replace(base,'')+' '+(r.failure()?.errorText||'')).slice(0,200)));
            page.on('response',r=>{if(r.status()>=400&&r.url().startsWith(base))rec.bad.push(r.status()+' '+r.request().method()+' '+r.url().replace(base,'').slice(0,160));});
            const t0=Date.now();
            try{const resp=await page.goto(base+p,{waitUntil:'networkidle',timeout:60000});rec.http=resp?.status()??null;}catch(e){rec.error=String(e.message||e).slice(0,160);}
            await page.waitForTimeout(2500);
            rec.ms=Date.now()-t0;
            try{rec.title=await page.title();rec.textLen=(await page.innerText('body')).length;rec.h1=(await page.locator('h1').allInnerTexts()).slice(0,2);
              rec.visibleErrors=(await page.locator('[role=alert], .error, [data-error]').allInnerTexts()).map(s=>s.slice(0,160)).slice(0,5);
              rec.links=(await page.$$eval('a[href^="/"]',as=>[...new Set(as.map(a=>a.getAttribute('href')))])).slice(0,40);}catch{}
            out.pages.push(rec);await ctx.close();
          }
          await browser.close();
          const apis=['/api/site-settings','/api/company/search?q=aramco','/api/company/search?q=AAPL','/api/company/quote?symbol=2222.SR','/api/company/quote?symbol=AAPL','/api/company/chart?symbol=2222.SR','/api/company/chart?symbol=MSFT',
            '/api/gold/quote','/api/gold/fx','/api/gold/chart','/api/accuracy-sample','/api/backtest','/api/research','/api/temporal','/api/market-watch','/api/forecast-tests',
            '/api/aziz/company?symbol=2222.SR','/api/aziz/monitor','/api/aziz/readiness','/api/research/export',
            '/api/admin/backtest/aggregate','/api/admin/backtest/export','/api/admin/council','/api/admin/dashboard','/api/admin/heartbeat','/api/admin/retention','/api/admin/run-background','/api/admin/screener-history','/api/admin/screener-operations','/api/admin/signin','/api/admin/state','/api/admin/verify','/api/admin/jobs/evaluate-due'];
          for(const a of apis){
            const t0=Date.now();const rec={path:a};
            try{const r=await fetch(base+a,{redirect:'manual',signal:AbortSignal.timeout(60000)});const tx=await r.text();
              rec.http=r.status;rec.ms=Date.now()-t0;rec.ct=(r.headers.get('content-type')||'').slice(0,40);rec.bytes=tx.length;rec.loc=r.headers.get('location')?.slice(0,80)||null;
              let j=null;try{j=JSON.parse(tx)}catch{}
              rec.body=j?JSON.stringify(j).slice(0,220):tx.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,160);
            }catch(e){rec.http=0;rec.ms=Date.now()-t0;rec.error=String(e.name||e).slice(0,60);}
            out.apis.push(rec);
          }
          console.log(JSON.stringify(out,null,1));
          NODE
          wc -c out/smoke.json
          node -e 'const fs=require("fs");fs.writeFileSync("out/body.json",JSON.stringify({message:"ci diagnostics: smoke run "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out/smoke.json").toString("base64")}))'
          GH_TOKEN="${{ github.token }}" gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/smoke-${{ github.run_id }}-${{ github.run_attempt }}.json" --input out/body.json >/dev/null \
            || echo "WARN: failed to publish result" >&2
