name: Agent picks - Saudi (20 by momentum, live forecasts recorded)

# Every Saudi trading day shortly after the open: rank the frozen 40-stock SA universe (mizan-v45/lib/daily-picks-universe.ts)
# by mom126_5, take the top 20, call the live POST /api/company/analyze for each (sequential, >= 2 s apart, 150 s timeout,
# up to 2 retries on 5xx) and store horizons 1/5/21 in research/agent-picks/sa/<UTC date>.json on branch mizan-aziz-deploy.
# Each analyze call ALSO records the forecast in production D1 (intended). No secret is needed (analyze is public).
# Status: EXPLORATORY descriptive record - not the DIR-0002 ledger, no claim (research/REGISTRY.md).
#
# Schedule: 07:20 UTC = 10:20 Riyadh (UTC+3, no DST), Sunday-Thursday (cron day-of-week 0-4). Tadawul opens 10:00.
# Scheduled runs skip Saudi holidays: if no SA bar/quote dated today is seen (re-checked once after 10 min), nothing is
# called or written. GitHub runs `schedule` only from the DEFAULT branch: this file must also be merged to `main`.
# push (editing this file on mizan-aziz-deploy) = a real, published trial run (owner request); workflow_dispatch = real run.
on:
  schedule:
    - cron: "20 7 * * 0-4"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of Saudi stocks to pick (top N by mom126_5)"
        required: false
        default: "20"
      publish:
        description: "Commit the run file to mizan-aziz-deploy (false = artifact only; analyze still records in D1)"
        type: boolean
        default: true
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/agent-picks-sa.yml"

permissions:
  contents: write

concurrency:
  group: agent-picks-sa
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'true' || 'false' }}
      COUNT: ${{ inputs.count || '20' }}
      SESSION_FLAG: ${{ github.event_name == 'schedule' && '--require-session-today' || '' }}
    steps:
      - name: Checkout working branch (also when this file runs from main on schedule)
        uses: actions/checkout@v4
        with:
          ref: mizan-aziz-deploy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests (offline)
        run: node --test research/tests/agent-picks.test.mjs

      - name: Run (select by momentum, analyze live, write append-only file)
        id: run
        shell: bash
        run: |
          set +e
          if [ "$PUBLISH" = "true" ]; then OUT=research/agent-picks; else OUT="$RUNNER_TEMP/agent-picks"; fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          node research/experiments/agent-picks-run.mjs sa "$COUNT" "$OUT" --deadline-min=45 --spacing-ms=3000 $SESSION_FLAG
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "3" ] || exit "$code"
          exit 0

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Agent picks - Saudi"
            echo "- outcome: ${{ steps.run.outputs.outcome }}"
            echo "- file: \`${{ steps.run.outputs.file }}\`"
            echo "- analyze ok/selected: ${{ steps.run.outputs.ok }}/${{ steps.run.outputs.selected }} (failed ${{ steps.run.outputs.failed }})"
            echo "- publish: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run file as artifact
        if: always() && steps.run.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-picks-sa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.out }}/${{ steps.run.outputs.file }}
          if-no-files-found: warn

      - name: Commit and push to mizan-aziz-deploy (append-only file)
        if: env.PUBLISH == 'true' && steps.run.outputs.file != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898232+github-actions[bot]@users.noreply.github.com"
          git add research/agent-picks/sa
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "agent-picks: sa ${{ steps.run.outputs.outcome }} ${{ steps.run.outputs.file }} ok=${{ steps.run.outputs.ok }}/${{ steps.run.outputs.selected }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin mizan-aziz-deploy && git push -q origin HEAD:mizan-aziz-deploy; then echo "pushed $(git rev-parse --short HEAD)"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed - retrying"; sleep $((i*5))
          done
          echo "::error title=agent-picks-sa::could not push after 5 attempts"; exit 1

      - name: Fail loudly if every analyze call failed (the failure itself was recorded above)
        if: steps.run.outputs.code == '3'
        run: |
          echo "::error title=agent-picks-sa::all analyze calls failed"
          exit 1
