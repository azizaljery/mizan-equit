name: Macro source probe (read-only GET, no secrets)
on:
  pull_request:
    paths: ['.github/workflows/macro-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const list=[
           ['FRED FEDFUNDS','https://fred.stlouisfed.org/graph/fredgraph.csv?id=FEDFUNDS'],
           ['FRED CPIAUCSL','https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL'],
           ['FRED T10Y2Y','https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y'],
           ['FRED DGS10','https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10'],
           ['FRED DTWEXBGS','https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTWEXBGS'],
           ['FRED BRENT','https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU'],
           ['FRED UNRATE','https://fred.stlouisfed.org/graph/fredgraph.csv?id=UNRATE'],
           ['WB SAU CPI','https://api.worldbank.org/v2/country/SAU/indicator/FP.CPI.TOTL.ZG?format=json&per_page=4'],
           ['WB SAU GDP growth','https://api.worldbank.org/v2/country/SAU/indicator/NY.GDP.MKTP.KD.ZG?format=json&per_page=4'],
           ['IMF SAU GDP growth','https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/SAU'],
           ['SAMA site','https://www.sama.gov.sa/en-US/Pages/default.aspx'],
           ['GASTAT site','https://www.stats.gov.sa/en'],
           ['GASTAT CPI page','https://www.stats.gov.sa/en/w/consumer-price-index'],
          ];
          for(const [n,u] of list){const t=Date.now();try{const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0 mizan-probe'},signal:AbortSignal.timeout(25000)});const tx=await r.text();console.log(JSON.stringify({n,http:r.status,ms:Date.now()-t,type:r.headers.get('content-type'),len:tx.length,head:tx.slice(0,160).replace(/\s+/g,' '),tail:tx.slice(-120).replace(/\s+/g,' ')}));}catch(e){console.log(JSON.stringify({n,error:String(e).slice(0,120)}));}}
          NODE
