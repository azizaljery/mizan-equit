name: Yahoo chart meta probe (read-only, diagnostics)

# Fetches public Yahoo chart metadata for index/benchmark symbols used by the accuracy sample to diagnose
# why ^TASI.SR session dates are unavailable. No secrets; no writes except the result file.
on:
  workflow_dispatch:
  push:
    branches:
      - mizan-aziz-deploy
    paths:
      - ".github/workflows/yahoo-meta-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node --input-type=module <<'NODE' > out/meta.json
          const out={at:new Date().toISOString(),rows:[]};
          const url=(s,a,b)=>{const p1=Math.floor(Date.parse(a+'T00:00:00Z')/1000),p2=Math.floor(Date.parse(b+'T00:00:00Z')/1000)+86400;return `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?interval=1d&period1=${p1}&period2=${p2}&events=splits%2Cdiv`;};
          const variants=[['1y','2222.SR','https://query1.finance.yahoo.com/v8/finance/chart/2222.SR?interval=1d&range=1y'],['1y','1120.SR','https://query1.finance.yahoo.com/v8/finance/chart/1120.SR?interval=1d&range=1y'],['1y','2010.SR','https://query1.finance.yahoo.com/v8/finance/chart/2010.SR?interval=1d&range=1y'],['5d','2222.SR','https://query1.finance.yahoo.com/v8/finance/chart/2222.SR?interval=1d&range=5d'],['1y-ev','2222.SR','https://query1.finance.yahoo.com/v8/finance/chart/2222.SR?interval=1d&range=1y&events=splits%2Cdiv']];
          for(const [label,s,u] of variants){
            const rec={symbol:s,label};
            try{const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(20000)});rec.http=r.status;const j=await r.json().catch(()=>null);
              const res=j?.chart?.result?.[0];
              if(res){const m=res.meta;const off=m.gmtoffset||0;const ts=res.timestamp||[];rec.points=ts.length;rec.last3=ts.slice(-3).map(t=>new Date((t+off)*1000).toISOString().slice(0,16));rec.closeLast3=(res.indicators?.quote?.[0]?.close||[]).slice(-3);rec.regularMarketTime=m.regularMarketTime?new Date(m.regularMarketTime*1000).toISOString():null;rec.tradingPeriod=m.currentTradingPeriod?.regular;}
            }catch(e){rec.error=String(e).slice(0,100);}
            out.rows.push(rec);
          }
          console.log(JSON.stringify(out,null,1));
          NODE
          node -e 'const fs=require("fs");fs.writeFileSync("out/body.json",JSON.stringify({message:"ci diagnostics: yahoo meta "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out/meta.json").toString("base64")}))'
          GH_TOKEN="${{ github.token }}" gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/yahoo-meta-${{ github.run_id }}-${{ github.run_attempt }}.json" --input out/body.json >/dev/null || echo "WARN: publish failed" >&2
