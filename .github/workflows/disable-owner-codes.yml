name: Disable owner codes (owner request 2026-10-31) — admin password and Mizan gate PIN

# Applies exactly what the in-app action «إلغاء الرمز» (lib/admin-access.ts disableOwnerCode) does, for both targets:
#   admin: admin_access.password_hash = 'disabled', attempts/window reset, audit row 'disable_admin_password'
#   gate : recommendation_lock.pin_hash = 'disabled', attempts/window reset, audit row 'disable_gate_pin'
# Not changed: Cloudflare Access (owner account sign-in), ADMIN_USERNAME, Worker secrets, code, deploy.
# Re-enabling later: set a new code from the admin panel («تغيير الرمز») or the reset-*-pin workflows.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type DISABLE to apply"
        required: true
  push:
    branches: [ops/disable-owner-codes]
    paths: ['.github/workflows/disable-owner-codes.yml']

permissions:
  contents: write

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply (no-op unless confirm=DISABLE)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM: ${{ inputs.confirm }}
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node --input-type=module <<'NODE' > out/result.json
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,tok=process.env.CLOUDFLARE_API_TOKEN,DB='e95b74e8-81d6-4beb-8ea2-ad59c863d21d';
          const q=async(sql,params=[])=>{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${acct}/d1/database/${DB}/query`,{method:'POST',headers:{Authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)});const j=await r.json().catch(()=>({}));return {http:r.status,success:!!j.success,rows:j.result?.[0]?.results};};
          const out={at:new Date().toISOString(),mode:process.env.CONFIRM==='DISABLE'?'apply':'noop'};
          const state=async()=>({
            admin:(await q("SELECT (password_hash='disabled') AS disabled, attempts FROM admin_access WHERE id=1")).rows,
            gate:(await q("SELECT (pin_hash='disabled') AS disabled, attempts, (owner_id<>'') AS owner_bound FROM recommendation_lock WHERE id=1")).rows});
          out.before=await state();
          if(out.mode==='apply'){
            const at=out.at;
            out.admin=[await q("INSERT OR IGNORE INTO admin_access (id) VALUES (1)"),
              await q("UPDATE admin_access SET password_hash='disabled',password_changed_at=?,attempts=0,window_started=0 WHERE id=1",[at]),
              await q("INSERT INTO admin_audit(id,created_at,action,data) VALUES(?,?,?,?)",[crypto.randomUUID(),at,'disable_admin_password',JSON.stringify({changedAt:at,via:'owner-request-workflow'})])].map(x=>({http:x.http,success:x.success}));
            out.gate=[await q("INSERT OR IGNORE INTO recommendation_lock (id,pin_hash) VALUES (1,'disabled')"),
              await q("UPDATE recommendation_lock SET pin_hash='disabled',attempts=0,window_started=0 WHERE id=1"),
              await q("INSERT INTO admin_audit(id,created_at,action,data) VALUES(?,?,?,?)",[crypto.randomUUID(),at,'disable_gate_pin',JSON.stringify({changedAt:at,via:'owner-request-workflow'})])].map(x=>({http:x.http,success:x.success}));
            out.after=await state();
          }
          console.log(JSON.stringify(out));
          NODE
          cat out/result.json
          node -e 'const fs=require("fs");fs.writeFileSync("out/body.json",JSON.stringify({message:"ci diagnostics: disable owner codes "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out/result.json").toString("base64")}))'
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/disable-owner-codes-${RID}.json" --input out/body.json >/dev/null || true
