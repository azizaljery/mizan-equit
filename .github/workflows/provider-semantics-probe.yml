name: Provider semantics probe (read-only, one run, diagnostics only)

# FCST-0005 / volume policy evidence. 8 read-only GET requests to the host the app already uses (query1.finance.yahoo.com).
# No secrets, no schedule, no data other than public chart metadata/bars. Result file only.
on:
  push:
    branches:
      - fcst-0005-review
    paths:
      - ".github/workflows/provider-semantics-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node --input-type=module <<'NODE' > out/probe.json
          const out={startedAt:new Date().toISOString(),rows:[]};
          const syms=['AAPL','MSFT','2222.SR','1120.SR'];
          const forms=[['1m-1d','interval=1m&range=1d&includePrePost=false'],['1d-5d','interval=1d&range=5d&includePrePost=false']];
          for(const s of syms)for(const [label,q] of forms){
            const rec={symbol:s,label,requestedAt:new Date().toISOString()};
            try{
              const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?${q}`,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(20000)});
              rec.http=r.status;const j=await r.json().catch(()=>null);const res=j?.chart?.result?.[0];
              if(res){
                const m=res.meta,off=m.gmtoffset||0,ts=res.timestamp||[],qt=res.indicators?.quote?.[0]||{};
                rec.meta={symbol:m.symbol,exchangeName:m.exchangeName,exchangeTimezoneName:m.exchangeTimezoneName,timezone:m.timezone,gmtoffset:m.gmtoffset,instrumentType:m.instrumentType,dataGranularity:m.dataGranularity,range:m.range,
                  regularMarketTime:m.regularMarketTime?new Date(m.regularMarketTime*1000).toISOString():null,regularMarketVolume:m.regularMarketVolume??null,regularMarketPrice:m.regularMarketPrice,
                  currentTradingPeriod:m.currentTradingPeriod?Object.fromEntries(Object.entries(m.currentTradingPeriod).map(([k,v])=>[k,{start:new Date(v.start*1000).toISOString(),end:new Date(v.end*1000).toISOString()}])):null};
                rec.points=ts.length;
                if(label==='1d-5d'){rec.bars=ts.map((t,i)=>({localDate:new Date((t+off)*1000).toISOString().slice(0,16),utc:new Date(t*1000).toISOString(),close:qt.close?.[i]??null,volume:qt.volume?.[i]??null}));}
                else{const v=(qt.volume||[]).map(x=>x||0);rec.minute={first:ts.length?new Date(ts[0]*1000).toISOString():null,last:ts.length?new Date(ts.at(-1)*1000).toISOString():null,sumVolume:v.reduce((a,b)=>a+b,0),nullCloses:(qt.close||[]).filter(x=>x==null).length};}
              }
            }catch(e){rec.error=String(e).slice(0,120);}
            out.rows.push(rec);
          }
          out.finishedAt=new Date().toISOString();
          console.log(JSON.stringify(out,null,1));
          NODE
          head -c 5000 out/probe.json
          node -e 'const fs=require("fs");fs.writeFileSync("out/body.json",JSON.stringify({message:"ci diagnostics: provider semantics probe "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out/probe.json").toString("base64")}))'
          GH_TOKEN="${{ github.token }}" gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/provider-semantics-${{ github.run_id }}.json" --input out/body.json >/dev/null || echo "WARN: publish failed" >&2
