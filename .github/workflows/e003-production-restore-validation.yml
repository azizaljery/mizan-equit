name: Phase 1 E-003 Production Restore Validation

on:
  push:
    branches:
      - phase1/e003-production-restore-validation
    paths:
      - ".github/workflows/e003-production-restore-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-e003-production-restore
  cancel-in-progress: false

jobs:
  e003:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mizan-v45
    env:
      PROD_DB_NAME: mizan-equity-db
      RESTORE_DB_NAME: mizan-equity-e003-${{ github.run_id }}
      RESTORE_WORKER_NAME: mizan-e003-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mizan-v45/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build current application and locate Wrangler config
        id: wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          config="$(find dist -type f -name wrangler.json -print -quit)"
          test -n "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Prepare sanitized evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-out/e003
          cat > verify-out/e003/guardrails.txt <<'EOF'
          SOURCE=mizan-equity-db
          TARGET=isolated D1 only
          PRODUCTION_MUTATION=FORBIDDEN
          RAW_EXPORT_IN_GIT=FORBIDDEN
          RAW_EXPORT_AS_ARTIFACT=FORBIDDEN
          CRON_ON_ISOLATED_WORKER=DISABLED
          EOF

      - name: Capture production identity
        shell: bash
        run: |
          set -euo pipefail
          config="${{ steps.wrangler.outputs.config }}"
          npx wrangler d1 info "$PROD_DB_NAME" --json --config "$config" > verify-out/e003/production-db-info.json
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("verify-out/e003/production-db-info.json","utf8"));
            const o={name:j.name||process.env.PROD_DB_NAME,uuid:j.uuid||j.id||j.database_id||null,version:j.version||null,numTables:j.num_tables||j.numTables||null,fileSize:j.file_size||j.fileSize||null,capturedAt:new Date().toISOString()};
            fs.writeFileSync("verify-out/e003/production-identity-sanitized.json",JSON.stringify(o,null,2));
          '
          rm -f verify-out/e003/production-db-info.json

      - name: Capture production schema and critical fingerprints
        shell: bash
        run: |
          set -euo pipefail
          config="${{ steps.wrangler.outputs.config }}"
          tmp="$RUNNER_TEMP/e003-prod"
          mkdir -p "$tmp"
          npx wrangler d1 execute DB --remote --config "$config" --command="SELECT name,type FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name;" --json > "$tmp/schema.json"
          sha256sum "$tmp/schema.json" | awk '{print $1}' > verify-out/e003/production-schema.sha256
          node -e '
            const fs=require("fs"),j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const rows=(Array.isArray(j)?j[0]?.results:j?.results)||[];
            fs.writeFileSync("verify-out/e003/schema-objects.json",JSON.stringify({count:rows.length,objects:rows},null,2));
          ' "$tmp/schema.json"
          : > verify-out/e003/production-critical-hashes.txt
          : > verify-out/e003/production-critical-counts.txt
          for table in site_settings settings_history paper_portfolios paper_cash_entries paper_trades forecast_records forecast_outcomes; do
            npx wrangler d1 execute DB --remote --config "$config" --command="SELECT * FROM \"$table\" ORDER BY 1;" --json > "$tmp/$table.json"
            npx wrangler d1 execute DB --remote --config "$config" --command="SELECT COUNT(*) AS n FROM \"$table\";" --json > "$tmp/$table.count.json"
            printf '%s %s\n' "$table" "$(sha256sum "$tmp/$table.json" | awk '{print $1}')" >> verify-out/e003/production-critical-hashes.txt
            node -e '
              const fs=require("fs"),j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=(Array.isArray(j)?j[0]?.results:j?.results)||[];
              const n=rows[0]?.n ?? null;
              fs.appendFileSync("verify-out/e003/production-critical-counts.txt",process.argv[2]+" "+n+"\n");
            ' "$tmp/$table.count.json" "$table"
          done

      - name: Export real production SQL outside repository
        id: export
        shell: bash
        run: |
          set -euo pipefail
          config="${{ steps.wrangler.outputs.config }}"
          export_file="$RUNNER_TEMP/mizan-production-e003.sql"
          started="$(date -u +%FT%TZ)"
          npx wrangler d1 export "$PROD_DB_NAME" --remote --config "$config" --output="$export_file" >/dev/null
          ended="$(date -u +%FT%TZ)"
          sha="$(sha256sum "$export_file" | awk '{print $1}')"
          size="$(stat -c %s "$export_file")"
          printf '{"source":"%s","startedAt":"%s","endedAt":"%s","sha256":"%s","bytes":%s}\n' "$PROD_DB_NAME" "$started" "$ended" "$sha" "$size" > verify-out/e003/export-evidence.json
          echo "export_file=$export_file" >> "$GITHUB_OUTPUT"

      - name: Create isolated D1 in EEUR
        id: isolated
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "{\"name\":\"$RESTORE_DB_NAME\",\"primary_location_hint\":\"eeur\"}"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          success="$(printf '%s' "$response" | jq -r '.success')"
          test "$success" = "true"
          uuid="$(printf '%s' "$response" | jq -r '.result.uuid')"
          test -n "$uuid" -a "$uuid" != "null"
          echo "restore_db_id=$uuid" >> "$GITHUB_OUTPUT"
          echo "RESTORE_DB_ID=$uuid" >> "$GITHUB_ENV"
          printf '{"name":"%s","uuid":"%s","location":"EEUR","createdAt":"%s"}\n' "$RESTORE_DB_NAME" "$uuid" "$(date -u +%FT%TZ)" > verify-out/e003/isolated-db-identity.json

      - name: Build isolated Wrangler config
        id: isoconfig
        shell: bash
        run: |
          set -euo pipefail
          config="${{ steps.wrangler.outputs.config }}"
          dir="$(dirname "$config")"
          iso="$dir/wrangler.e003.json"
          node - "$config" "$iso" <<'NODE'
          const fs=require('fs');
          const [src,dst]=process.argv.slice(2);
          const c=JSON.parse(fs.readFileSync(src,'utf8'));
          c.name=process.env.RESTORE_WORKER_NAME;
          const dbs=Array.isArray(c.d1_databases)?c.d1_databases:[];
          let found=false;
          c.d1_databases=dbs.map(x=>{
            if(x.binding==='DB'){
              found=true;
              return {...x,database_name:process.env.RESTORE_DB_NAME,database_id:process.env.RESTORE_DB_ID,preview_database_id:process.env.RESTORE_DB_ID};
            }
            return x;
          });
          if(!found) throw new Error('DB binding not found in generated Wrangler config');
          if(c.triggers) c.triggers={...c.triggers,crons:[]};
          delete c.route;
          delete c.routes;
          c.workers_dev=true;
          fs.writeFileSync(dst,JSON.stringify(c,null,2));
          NODE
          echo "config=$iso" >> "$GITHUB_OUTPUT"

      - name: Restore production export into isolated D1
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.isoconfig.outputs.config }}"
          started="$(date -u +%FT%TZ)"
          npx wrangler d1 execute DB --remote --config "$iso" --file="${{ steps.export.outputs.export_file }}" --yes >/dev/null
          ended="$(date -u +%FT%TZ)"
          printf '{"source":"%s","target":"%s","targetUuid":"%s","startedAt":"%s","endedAt":"%s","result":"PASS"}\n' "$PROD_DB_NAME" "$RESTORE_DB_NAME" "$RESTORE_DB_ID" "$started" "$ended" > verify-out/e003/restore-execution.json

      - name: Verify isolated database integrity and schema
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.isoconfig.outputs.config }}"
          npx wrangler d1 execute DB --remote --config "$iso" --command="PRAGMA quick_check;" --json > verify-out/e003/quick-check.json
          npx wrangler d1 execute DB --remote --config "$iso" --command="PRAGMA foreign_key_check;" --json > verify-out/e003/foreign-key-check.json
          npx wrangler d1 execute DB --remote --config "$iso" --command="PRAGMA foreign_keys;" --json > verify-out/e003/foreign-keys.json
          npx wrangler d1 execute DB --remote --config "$iso" --command="SELECT name,type FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name;" --json > "$RUNNER_TEMP/e003-isolated-schema.json"
          sha256sum "$RUNNER_TEMP/e003-isolated-schema.json" | awk '{print $1}' > verify-out/e003/isolated-schema.sha256
          test "$(cat verify-out/e003/production-schema.sha256)" = "$(cat verify-out/e003/isolated-schema.sha256)"

      - name: Verify critical records match restored production
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.isoconfig.outputs.config }}"
          tmp="$RUNNER_TEMP/e003-iso"
          mkdir -p "$tmp"
          : > verify-out/e003/isolated-critical-hashes.txt
          : > verify-out/e003/isolated-critical-counts.txt
          for table in site_settings settings_history paper_portfolios paper_cash_entries paper_trades forecast_records forecast_outcomes; do
            npx wrangler d1 execute DB --remote --config "$iso" --command="SELECT * FROM \"$table\" ORDER BY 1;" --json > "$tmp/$table.json"
            npx wrangler d1 execute DB --remote --config "$iso" --command="SELECT COUNT(*) AS n FROM \"$table\";" --json > "$tmp/$table.count.json"
            printf '%s %s\n' "$table" "$(sha256sum "$tmp/$table.json" | awk '{print $1}')" >> verify-out/e003/isolated-critical-hashes.txt
            node -e '
              const fs=require("fs"),j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=(Array.isArray(j)?j[0]?.results:j?.results)||[];
              const n=rows[0]?.n ?? null;
              fs.appendFileSync("verify-out/e003/isolated-critical-counts.txt",process.argv[2]+" "+n+"\n");
            ' "$tmp/$table.count.json" "$table"
          done
          diff -u verify-out/e003/production-critical-hashes.txt verify-out/e003/isolated-critical-hashes.txt
          diff -u verify-out/e003/production-critical-counts.txt verify-out/e003/isolated-critical-counts.txt
          printf '{"criticalTables":["site_settings","settings_history","paper_portfolios","paper_cash_entries","paper_trades","forecast_records","forecast_outcomes"],"hashMatch":true,"countMatch":true}\n' > verify-out/e003/domain-verification.json

      - name: Deploy temporary isolated application with Cron disabled
        id: tempapp
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.isoconfig.outputs.config }}"
          log="$RUNNER_TEMP/e003-deploy.log"
          npx wrangler deploy --config "$iso" >"$log" 2>&1
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')"
          test -n "$subdomain" -a "$subdomain" != "null"
          url="https://$RESTORE_WORKER_NAME.$subdomain.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '{"worker":"%s","url":"%s","cronDisabled":true}\n' "$RESTORE_WORKER_NAME" "$url" > verify-out/e003/isolated-app-identity.json

      - name: Run read-only application smoke tests on restored production data
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.tempapp.outputs.url }}"
          : > verify-out/e003/application-smoke-tests.txt
          check(){
            name="$1"; target="$2"; expected="${3:-200}"
            code="$(curl -sS -o "$RUNNER_TEMP/e003-$name.out" -w '%{http_code}' "$target")"
            printf '%s %s\n' "$name" "$code" >> verify-out/e003/application-smoke-tests.txt
            test "$code" = "$expected"
          }
          check homepage "$url/"
          check deployment_identity "$url/mizan-deployment.json"
          check settings "$url/api/site-settings"
          check us_search "$url/api/company/search?q=AAPL&market=us"
          check sa_search "$url/api/company/search?q=2222&market=sa"

      - name: Prove read-only smoke tests caused no silent mutation
        shell: bash
        run: |
          set -euo pipefail
          iso="${{ steps.isoconfig.outputs.config }}"
          tmp="$RUNNER_TEMP/e003-post"
          mkdir -p "$tmp"
          : > verify-out/e003/post-smoke-critical-hashes.txt
          : > verify-out/e003/post-smoke-critical-counts.txt
          for table in site_settings settings_history paper_portfolios paper_cash_entries paper_trades forecast_records forecast_outcomes; do
            npx wrangler d1 execute DB --remote --config "$iso" --command="SELECT * FROM \"$table\" ORDER BY 1;" --json > "$tmp/$table.json"
            npx wrangler d1 execute DB --remote --config "$iso" --command="SELECT COUNT(*) AS n FROM \"$table\";" --json > "$tmp/$table.count.json"
            printf '%s %s\n' "$table" "$(sha256sum "$tmp/$table.json" | awk '{print $1}')" >> verify-out/e003/post-smoke-critical-hashes.txt
            node -e '
              const fs=require("fs"),j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=(Array.isArray(j)?j[0]?.results:j?.results)||[];
              const n=rows[0]?.n ?? null;
              fs.appendFileSync("verify-out/e003/post-smoke-critical-counts.txt",process.argv[2]+" "+n+"\n");
            ' "$tmp/$table.count.json" "$table"
          done
          diff -u verify-out/e003/isolated-critical-hashes.txt verify-out/e003/post-smoke-critical-hashes.txt
          diff -u verify-out/e003/isolated-critical-counts.txt verify-out/e003/post-smoke-critical-counts.txt
          printf '{"noSilentMutation":true,"verifiedAt":"%s"}\n' "$(date -u +%FT%TZ)" > verify-out/e003/no-silent-mutation.json

      - name: Write sanitized E-003 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export_sha="$(jq -r '.sha256 // "unknown"' verify-out/e003/export-evidence.json 2>/dev/null || echo unknown)"
          cat > verify-out/e003/E-003-SUMMARY.md <<EOF
          # E-003 Production Restore Validation

          - Mode: ISOLATED
          - Production mutation: FORBIDDEN
          - Production database: mizan-equity-db
          - Production export SHA-256: $export_sha
          - Isolated database: $RESTORE_DB_NAME
          - Raw production export stored in Git: NO
          - Raw production export uploaded as artifact: NO
          - Cron on isolated worker: DISABLED

          This package contains sanitized evidence only. Human review is still required.
          EOF

      - name: Upload sanitized E-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e003-sanitized-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: mizan-v45/verify-out/e003/
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup temporary worker
        if: always()
        shell: bash
        run: |
          curl -sS -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$RESTORE_WORKER_NAME" >/dev/null || true

      - name: Cleanup isolated D1
        if: always()
        shell: bash
        run: |
          if [ -n "${RESTORE_DB_ID:-}" ]; then
            curl -sS -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$RESTORE_DB_ID" >/dev/null || true
          fi
