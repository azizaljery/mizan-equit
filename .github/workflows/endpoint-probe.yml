name: Endpoint probe (read-only GET against mizan-aziz)
on:
  push:
    branches: [market-overview]
    paths: [".github/workflows/endpoint-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Probe
        env: {RID: "${{ github.run_id }}", REF: "${{ github.ref_name }}", GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          node --input-type=module <<'NODE' > out.json
          const base='https://mizan-aziz.aljeryabod.workers.dev',out={overview:[],analyze:[]};
          for(const m of ['sa','us']){const t=Date.now();try{const r=await fetch(`${base}/api/market-overview?market=${m}&r=${Date.now()}`,{signal:AbortSignal.timeout(60000)});const tx=await r.text();let j=null;try{j=JSON.parse(tx)}catch{};out.overview.push({m,http:r.status,ms:Date.now()-t,cache:r.headers.get('cf-cache-status'),indices:j?.indices?.map(x=>[x.symbol,x.price,x.changePct,x.asOf]),proxy:!!j?.proxy,breadth:j?.breadth,notes:j?.notes,err:j?.error||(!j?tx.slice(0,200):null)});}catch(e){out.overview.push({m,error:String(e).slice(0,100)});}}
          // Normal user analysis (records a forecast like any visitor).
          for(const symbol of []){const t=Date.now();try{const r=await fetch(`${base}/api/company/analyze`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({symbol}),signal:AbortSignal.timeout(150000)});const tx=await r.text();let j=null;try{j=JSON.parse(tx)}catch{};
            const f=j?.forecast;const items=Array.isArray(f)?f:(f?.items||f?.forecasts||f?.horizons||null);
            out.analyze.push({symbol,http:r.status,ms:Date.now()-t,topKeys:j?Object.keys(j).slice(0,30):null,forecastKeys:f&&typeof f==='object'?Object.keys(f).slice(0,30):null,rows:(f?.rows||[]).map(r=>({p:r.period,s:r.sessions,ok:r.available,dir:r.direction,pp:r.predictedPrice,pct:r.expectedChangePct,range:r.range,conf:r.confidence,cov:r.coverage,why:r.available?null:(r.reasons||[]).join(' | ').slice(0,300),regime:r.modelCondition?.regime,shock:r.modelCondition?.shock})),price:f?.price,dq:f?.dataQuality,err:j?.error||(!j?tx.slice(0,200):null)});}catch(e){out.analyze.push({symbol,error:String(e).slice(0,100)});}
            await new Promise(r=>setTimeout(r,8000));}
          console.log(JSON.stringify(out,null,1));
          NODE
          node -e 'const fs=require("fs");fs.writeFileSync("body.json",JSON.stringify({message:"ci diagnostics: endpoint probe "+process.env.RID,branch:process.env.REF,content:fs.readFileSync("out.json").toString("base64")}))'
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/endpoint-probe-${RID}.json" --input body.json >/dev/null
      - name: Screenshot home (SA and US tabs)
        env: {RID: "${{ github.run_id }}", REF: "${{ github.ref_name }}", GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          mkdir -p pw && cd pw && npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:820,height:1180},locale:'ar-SA'});
          const logs=[];p.on('console',m=>{if(m.type()==='error')logs.push(m.text().slice(0,200))});p.on('response',r=>{if(r.url().includes('market-overview'))logs.push('resp '+r.status()+' '+r.url().slice(-40))});
          await p.goto('https://mizan-aziz.aljeryabod.workers.dev/',{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(4000);
          const panel=p.locator('section[aria-label="نظرة على السوق"]');
          const txt1=await panel.innerText().catch(e=>'NO PANEL '+e.message);
          await panel.screenshot({path:'sa.png'}).catch(()=>{});
          await p.getByRole('button',{name:'السوق الأمريكي'}).click().catch(()=>{});await p.waitForTimeout(4000);
          await panel.screenshot({path:'us.png'}).catch(()=>{});
          console.log(JSON.stringify({sa:txt1.slice(0,1500),logs}));await b.close();
          JS
          node shot.mjs > ../shot.json 2> ../shot.err || true; cd ..; tail -c 3000 shot.err > shot-err.txt || true
          for f in pw/sa.png pw/us.png shot.json shot-err.txt; do [ -f "$f" ] || continue; b=$(basename $f); node -e 'const fs=require("fs");fs.writeFileSync("b.json",JSON.stringify({message:"ci diagnostics: home shot "+process.env.RID,branch:process.env.REF,content:fs.readFileSync(process.argv[1]).toString("base64")}))' "$f"; gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/home-${RID}-$b" --input b.json >/dev/null; done
