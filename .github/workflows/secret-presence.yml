name: Secret presence check (names and booleans only)

# Reports whether each GitHub secret the mizan-aziz deploy maps into the Worker is set (non-empty). Never prints values,
# lengths, or hashes. Publishes a small JSON to ci-diagnostics on the dispatching branch. No deploy, no Cloudflare call.
on:
  workflow_dispatch:
  push:
    branches:
      - aziz-ledger-review
    paths:
      - ".github/workflows/secret-presence.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          S_TWELVE: ${{ secrets.MIZAN_AZIZ_TWELVE_DATA_API_KEY }}
          S_SEC_UA: ${{ secrets.MIZAN_AZIZ_SEC_USER_AGENT }}
          S_OWNER: ${{ secrets.MIZAN_AZIZ_OWNER_EMAIL }}
          S_TAVILY: ${{ secrets.MIZAN_AZIZ_TAVILY_API_KEY }}
          S_ALPACA: ${{ secrets.MIZAN_AZIZ_ALPACA_API_KEY }}
          S_GOLD: ${{ secrets.MIZAN_AZIZ_GOLDAPI_KEY }}
          S_METALS: ${{ secrets.MIZAN_AZIZ_METALS_DEV_API_KEY }}
          RID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
          const m={MIZAN_AZIZ_TWELVE_DATA_API_KEY:["S_TWELVE","TWELVE_DATA_API_KEY"],MIZAN_AZIZ_SEC_USER_AGENT:["S_SEC_UA","SEC_USER_AGENT"],MIZAN_AZIZ_OWNER_EMAIL:["S_OWNER","RECOMMENDATION_OWNER_EMAIL"],MIZAN_AZIZ_TAVILY_API_KEY:["S_TAVILY","TAVILY_API_KEY"],MIZAN_AZIZ_ALPACA_API_KEY:["S_ALPACA","ALPACA_API_KEY"],MIZAN_AZIZ_GOLDAPI_KEY:["S_GOLD","GOLDAPI_KEY"],MIZAN_AZIZ_METALS_DEV_API_KEY:["S_METALS","METALS_DEV_API_KEY"]};
          const out={at:new Date().toISOString(),secrets:Object.entries(m).map(([gh,[env,worker]])=>({githubSecret:gh,workerName:worker,set:!!(process.env[env]||"").trim()}))};
          require("fs").writeFileSync("body.json",JSON.stringify({message:"ci diagnostics: secret presence "+process.env.RID,branch:process.env.REF,content:Buffer.from(JSON.stringify(out,null,1)).toString("base64")}));
          console.log(JSON.stringify(out));'
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-diagnostics/secret-presence-${RID}.json" --input body.json >/dev/null
# rerun 2026-10-23T11:09:07Z
